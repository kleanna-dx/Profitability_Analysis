# ============================================================
# NLQ 수익성분석 서버 — Nginx 리버스 프록시
# 파일: /data/analytics/config/application.yml
# 포트: 18083 (외부 → Nginx → Node.js + Spring Boot)
#
# 구조:
#   Nginx(18083) ─→ Node.js(3000)     : /api/*, /pages/*, etc.
#                ─→ Spring Boot(18093) : /profit-api/*
# ============================================================

# ── 워커 설정 ──
worker_processes  auto;
error_log  /data/analytics/logs/nginx_error.log warn;
pid        /data/analytics/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 로그 형식 ──
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /data/analytics/logs/nginx_access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Upstream 정의 ──
    upstream nlq_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream profit_backend {
        server 127.0.0.1:18093;
        keepalive 16;
    }

    server {
        listen       18083;
        server_name  _;    # 포트 기반 구분이므로 모든 호스트로 수신

        # ── 기본 설정 ──
        charset utf-8;

        # 업로드 파일 크기 제한 (엑셀 업로드 최대 300MB)
        client_max_body_size 300M;

        # ── Spring Boot (module-profit) 프록시 ──
        # /profit-api/* 요청은 Spring Boot(18093)로 전달
        location /profit-api/ {
            proxy_pass http://profit_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # SAP RFC 배치는 최대 30분 소요
            proxy_connect_timeout 10s;
            proxy_read_timeout    1800s;
            proxy_send_timeout    60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 64k;
            proxy_busy_buffers_size 128k;
        }

        # ── Node.js 서버로 프록시 (기본) ──
        location / {
            proxy_pass http://nlq_backend;
            proxy_http_version 1.1;

            # 헤더 전달
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 지원 (필요 시)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Keep-Alive
            proxy_set_header Connection "";

            # ── 타임아웃 ──
            # NLQ AI 분석 + PPT 보고서 생성은 시간이 걸림
            proxy_connect_timeout 10s;
            proxy_read_timeout    180s;    # 최대 3분 (PPT 생성 타임아웃)
            proxy_send_timeout    60s;

            # ── 버퍼링 ──
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 64k;
            proxy_busy_buffers_size 128k;
        }

        # ── 헬스체크 (로드밸런서 연동 시) ──
        location /health {
            proxy_pass http://nlq_backend/api/status;
            proxy_read_timeout 5s;
            access_log off;
        }

        # ── 보안: 숨김 파일 차단 ──
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── .env 파일 직접 접근 차단 ──
        location ~ /\.env {
            deny all;
            return 404;
        }
    }
}
