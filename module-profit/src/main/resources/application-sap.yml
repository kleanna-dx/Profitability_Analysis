# ============================================================
# SAP RFC 연결 설정 (module-profit)
# Spring Boot 실행 시 --spring.profiles.active=sap 로 활성화
# 또는 상위 application.yml에 include하여 사용
# ============================================================

sap:
  rfc:
    # SAP BWP 시스템 연결 정보
    ashost: "10.2.14.220"
    sysnr: "01"
    sysid: "BWP"
    client: "100"
    user: "ITM120"
    passwd: "kleannara123@"
    lang: "KO"
    rfc-function: "Z_BI_WEB_EX_BL"

    # 커넥션 풀
    pool-capacity: 3
    peak-limit: 5

    # 스케줄러 설정
    schedule:
      enabled: true
      cron: "0 0 2 1 * *"         # 매월 1일 새벽 2시 (전월 데이터)
      # daily-cron: "0 0 6 * * *" # (선택) 매일 새벽 6시
